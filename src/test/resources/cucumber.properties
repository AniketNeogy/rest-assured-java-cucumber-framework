cucumber.publish.quiet=true
# Configure timeout for step execution
cucumber.execution.timeout=30000
# Configure strict mode - if steps are undefined, the test will fail
cucumber.execution.strict=true
# Configure parallel execution
cucumber.execution.parallel.enabled=true
# Plugin configuration
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber-pretty.html, json:target/cucumber-reports/CucumberTestReport.json, rerun:target/cucumber-reports/rerun.txt 